<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción - Cuchara & Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .form-section { border-bottom: 1px solid var(--trigo); margin-bottom: 30px; padding-bottom: 10px; margin-top: 20px; }
        .form-section h3 { font-family: 'Playfair Display', serif; color: var(--verde); text-transform: uppercase; font-size: 1.1rem; letter-spacing: 1px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 0.7rem; margin-bottom: 8px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #e0e0e0; 
            font-family: 'Montserrat', sans-serif; 
            background: #fff; 
            border-radius: 4px;
            font-size: 0.9rem;
            transition: border 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--trigo); outline: none; }
        .row { display: flex; gap: 20px; }
        .row .form-group { flex: 1; }
        .hidden { display: none; }

        @media (max-width: 800px) {
            .row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body class="menu-page">

    <header class="main-header">
        <div class="logo-container-central">
            <a href="index.html">
                <img src="logo-completo.png" alt="Cuchara & Co. Logo">
            </a>
        </div>
        
        <nav class="nav-menu-central">
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menú</a></li>
        <li><a href="galeria.html">Galería</a></li>
        <li><a href="inscripcion.html" style="color: var(--trigo);">Inscribirse</a></li>
        
        <li>
            <a href="inscripcion.html" class="cart-link">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </li>

        <li>
            <a href="https://wa.me/5491131445518" target="_blank" class="nav-whatsapp">
                <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i>
            </a>
        </li>
    </ul>
</nav>
    </header>

    <main class="container">
        <h2 class="section-title">Alta de Servicio</h2>
        
        <div class="menu-grid" style="grid-template-columns: 1fr; max-width: 700px; margin: 0 auto;">
            <div class="menu-card" style="text-align: left; padding: 40px; border-top: 5px solid var(--verde);">
                <form id="inscriptionForm" action="https://script.google.com/macros/s/AKfycbzTx5zzmG9l5FCvVmlwVcjUR9sSFGEtjv17NuXRT1SfaXzR00ps4qnIiFoPbfG_Gr3L/exec" method="POST">
                    
                    <div class="form-section"><h3>Tipo de Servicio</h3></div>
                    <div class="form-group">
                        <label>¿Qué servicio deseas contratar?</label>
                        <select name="Tipo_Servicio" id="selectorServicio" required onchange="toggleCampos()">
                            <option value="Escolar" selected>Servicio Escolar (Alumnos)</option>
                            <option value="Particular">Servicio Particular (Adultos / Oficina)</option>
                        </select>
                    </div>

                    <div class="form-section"><h3>Datos del Cliente</h3></div>
                    <div class="form-group">
                        <label>Nombre y Apellido del Responsable</label>
                        <input type="text" name="Responsable_Nombre" required placeholder="Nombre completo">
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Teléfono (WhatsApp)</label>
                            <input type="tel" name="Contacto_Telefono" required placeholder="Ej: 11 1234-5678">
                        </div>
                        <div class="form-group">
                            <label>Dirección de Entrega</label>
                            <input type="text" name="Entrega_Direccion" required placeholder="Calle y altura">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Localidad y Referencias</label>
                        <input type="text" name="Entrega_Localidad" placeholder="Ej: Lanús Oeste - Portón Negro">
                    </div>

                    <div id="seccionAlumno">
                        <div class="form-section"><h3>Datos del Alumno</h3></div>
                        <div class="form-group">
                            <label>Nombre y Apellido del Alumno</label>
                            <input type="text" name="Alumno_Nombre" id="inputAlumnoNombre" required placeholder="Nombre del estudiante">
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label>Colegio</label>
                                <input type="text" name="Alumno_Colegio" id="inputAlumnoColegio" required placeholder="Institución">
                            </div>
                            <div class="form-group">
                                <label>Año / Grado</label>
                                <input type="text" name="Alumno_Grado" id="inputAlumnoGrado" required placeholder="Ej: 4to Primaria">
                            </div>
                        </div>
                    </div>

                    <div class="form-section"><h3>Información Alimentaria</h3></div>
                    <div class="row">
                        <div class="form-group">
                            <label>¿Alergias?</label>
                            <input type="text" name="Salud_Alergias" placeholder="Maní, frutos secos, etc.">
                        </div>
                        <div class="form-group">
                            <label>¿Intolerancias?</label>
                            <input type="text" name="Salud_Intolerancias" placeholder="Lactosa, Gluten, etc.">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observaciones Adicionales</label>
                        <textarea name="Salud_Observaciones" rows="3" placeholder="Ej: Preferencias, porciones, detalles de entrega..."></textarea>
                    </div>

                    <div class="form-section"><h3>Detalles de Contratación</h3></div>
                    <div class="row">
                        <div class="form-group">
                            <label>Plan Elegido</label>
                            <select name="Servicio_Plan">
                                <option value="Promo Lanzamiento">Promo Lanzamiento (Westminster)</option>
                                <option value="Pack Semanal">Pack Semanal Particular</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Método de Pago</label>
                            <select name="Servicio_Pago" required>
                                <option value="Transferencia">Transferencia</option>
                                <option value="Efectivo">Efectivo</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; padding: 20px; margin-top: 30px; font-size: 1rem; letter-spacing: 2px;">
                        CONFIRMAR ALTA DE SERVICIO
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer style="background: var(--verde);">
        <p style="letter-spacing: 2px; color: var(--crema); font-size: 0.7rem; font-weight: 600;">© 2026 CUCHARA & CO. — BUENOS AIRES</p>
    </footer>

    <script>
        function toggleCampos() {
            const servicio = document.getElementById('selectorServicio').value;
            const seccionAlumno = document.getElementById('seccionAlumno');
            const inputsAlumno = [
                document.getElementById('inputAlumnoNombre'),
                document.getElementById('inputAlumnoColegio'),
                document.getElementById('inputAlumnoGrado')
            ];

            if (servicio === 'Particular') {
                seccionAlumno.classList.add('hidden');
                inputsAlumno.forEach(input => { input.required = false; input.value = ""; });
            } else {
                seccionAlumno.classList.remove('hidden');
                inputsAlumno.forEach(input => { input.required = true; });
            }
        }

        window.onload = toggleCampos;

        document.getElementById('inscriptionForm').onsubmit = function(e) {
            e.preventDefault();
            const form = e.target;
            const btnSubmit = form.querySelector('button[type="submit"]');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "PROCESANDO SOLICITUD...";

            const formData = new FormData(form);
            fetch(form.action, { method: 'POST', body: new URLSearchParams(formData) })
            .then(response => response.text())
            .then(result => {
                if (result === "CUPO_LLENO") {
                    alert("Lo sentimos, hemos alcanzado el cupo máximo para esta promoción.");
                } else {
                    const responsable = form.Responsable_Nombre.value;
                    const mensajeWS = `*Nueva Inscripción - Cuchara %26 Co*%0A*Cliente:* ${responsable}`;
                    window.open(`https://wa.me/5491131445518?text=${mensajeWS}`, '_blank');
                    alert("¡Inscripción registrada con éxito! Nos contactaremos a la brevedad.");
                    form.reset();
                    toggleCampos();
                }
                btnSubmit.disabled = false;
                btnSubmit.innerText = "CONFIRMAR ALTA DE SERVICIO";
            })
            .catch(() => {
                alert("Hubo un error al procesar la inscripción. Por favor, intenta de nuevo o contáctanos por WhatsApp.");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "CONFIRMAR ALTA DE SERVICIO";
            });
        };
    </script>
</body>
</html>
