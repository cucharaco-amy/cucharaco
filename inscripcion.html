<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones - Cuchara & Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="menu-page">

    <header class="menu-header">
        <a href="index.html" class="logo-text">CUCHARA <span>& CO.</span></a>
    </header>

    <main class="container">
        <h2 class="section-title">Alta de Servicio</h2>
        
        <div class="menu-grid" style="grid-template-columns: 1fr; max-width: 600px;">
            <div class="menu-card">
                <h3>Formulario de Inscripción</h3>
                <form id="inscriptionForm" action="https://formspree.io/f/palvez293@gmail.com" method="POST">
                    
                    <div style="text-align: left; margin-bottom: 15px;">
                        <label>Tipo de Servicio:</label>
                        <select name="servicio" required style="width: 100%; padding: 10px; margin-top: 5px;">
                            <option value="Escolar">Servicio Escolar (Viandas Colegio)</option>
                            <option value="Particular">Cliente Particular (Domicilio)</option>
                        </select>
                    </div>

                    <div style="text-align: left; margin-bottom: 15px;">
                        <label>Nombre Completo:</label>
                        <input type="text" name="nombre" required style="width: 100%; padding: 10px; margin-top: 5px;">
                    </div>

                    <div style="text-align: left; margin-bottom: 15px;">
                        <label>Teléfono de Contacto:</label>
                        <input type="tel" id="userPhone" name="telefono" required style="width: 100%; padding: 10px; margin-top: 5px;">
                    </div>

                    <div style="text-align: left; margin-bottom: 15px;">
                        <label>Detalles / Alergias:</label>
                        <textarea name="mensaje" rows="4" style="width: 100%; padding: 10px; margin-top: 5px;" placeholder="Ej: Alérgico al maní, menú vegetariano, etc."></textarea>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Enviar Inscripción</button>
                </form>
            </div>
        </div>

        <div class="cta-container">
            <a href="https://wa.me/5491131445518" class="btn-whatsapp" target="_blank">Consultar por WhatsApp</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Cuchara & Co. - Buenos Aires, Argentina</p>
    </footer>

    <script>
        const form = document.getElementById('inscriptionForm');
        
        form.addEventListener('submit', function(e) {
            // El formulario se enviará a Formspree por el "action"
            // Pero preparamos el mensaje de WhatsApp para que el usuario lo mande después
            const nombre = form.nombre.value;
            const servicio = form.servicio.value;
            const msg = `Hola Cuchara & Co! Soy ${nombre}, acabo de enviar mi inscripción para el servicio ${servicio}.`;
            
            // Abrimos WhatsApp en una ventana nueva después de un breve delay
            setTimeout(() => {
                window.open(`https://wa.me/5491131445518?text=${encodeURIComponent(msg)}`, '_blank');
            }, 1000);
        });
    </script>

</body>
</html>
