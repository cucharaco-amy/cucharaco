<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<body class="home">

    <div class="main-container">
        <header class="main-header">
            <img src="logo-completo.png" alt="Logo de Cuchara & Co." class="central-logo">

        <main class="main-content" style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
            <a href="menu.html" class="btn-primary">Ver Menú Mensual</a>
            
            <a href="inscripcion.html" style="text-decoration: none; color: var(--trigo); text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; font-weight: 600; border-bottom: 1px solid var(--trigo); padding-bottom: 5px; transition: 0.3s;">

            <div style="max-width: 600px; margin-top: 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left;">
